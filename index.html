<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calorie Counter</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">

</head>

<body class="bg-gray-100 min-h-screen">
    <main class="max-w-3xl mx-auto p-6">
        <header class=" text-center mb-10">
            <h1 class="text-5xl font-extrabold text-green-600 tracking-tight">Calorie Counter</h1>
            <p class="mt-3 text-lg text-gray-600 ">Track your calorie intake</p>
        </header>

    <section class="bg-white rounded-2x1 shadow p-6 mb-6" >
        <h2 class="text-lg font-semibold text-gray-700">Today's Calories</h2>
            <div class="mt-4 flex items-center justify-between"></div>
            <p class="text-4xl font-bold text-green-600">
                <span id="totalCalories">0</span> Kcal Consumed
            </p>

       
    </section>  
    
    <section class="bg-white rounded-2x1 shadow-md p-6 mb-8">
        <form id="foodForm" class="space-y-4">
             <div class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                <input type="text" id="foodName" placeholder="Food name" class="w-full border rounded-lg p-3 focus:outline-none ">                      
                <input type="number" id="foodCalories" placeholder="Calories" class="w-full border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-green-500">           
                 <button type="submit" class="w-full py-3 text-white bg-green-600 rounded-lg transition duration-300 hover:bg-green-700">Add Food</button>           
                   
        </form>
    </section>

    <section class="mb-8">

            <h2 class="text-2xl font-semibold mb-4 text-gray-800"> Today's Meals</h2>
             <div id="foodList" class="space-y-4">
                <!--food cards appear here-->
             </div>  
    </section>

        
        <button id="resetBtn" class="w-full mt-6 bg-red-500 text-white py-3 rounded-lg hover:bg-red-600 transition">Reset</button>
            
           
        
    
    </main>

    <script src="script.js"></script>
</body>
</html>
